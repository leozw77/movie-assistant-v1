name: Build Douban Interest API Probe

on:
  push:
    branches:
      - feature/douban-interest-api-probe-20260826
    paths:
      - 'tools/DoubanInterestApiProbe/**'
      - '.github/workflows/douban-interest-api-probe.yml'
  workflow_dispatch:

# v2 layout rebuild trigger: controls moved to fixed top bar for DPI safety.
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tools/DoubanInterestApiProbe/DoubanInterestApiProbe.csproj

      - name: Publish win-x64 self-contained
        run: dotnet publish tools/DoubanInterestApiProbe/DoubanInterestApiProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/DoubanInterestApiProbe

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/DoubanInterestApiProbe/* -DestinationPath artifacts/DoubanInterestApiProbe-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoubanInterestApiProbe-win-x64
          path: artifacts/DoubanInterestApiProbe-win-x64.zip
          if-no-files-found: error
