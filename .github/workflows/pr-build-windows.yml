name: PR Build Windows

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate project
        id: locate
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
          if (-not $proj) { throw 'No .csproj found' }
          "project=$($proj.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: dotnet restore "${{ steps.locate.outputs.project }}"

      - name: Build Release
        shell: pwsh
        run: dotnet build "${{ steps.locate.outputs.project }}" -c Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish "${{ steps.locate.outputs.project }}" -c Release -r win-x64 --self-contained true --no-restore -o .\dist\windows

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path .\dist\windows\* -DestinationPath .\movie-assistant-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: movie-assistant-win-x64
          path: movie-assistant-win-x64.zip
          if-no-files-found: error
